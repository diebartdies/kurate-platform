services:
  mongo:
    image: mongo:4.4
    pull_policy: if_not_present
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    container_name: KuraTe_mongo_dev
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build:
      context: .
      args:
        INSTALL_TWILIO: "${INSTALL_TWILIO:-0}"
    container_name: KuraTe_app_dev
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/KuraTe
    ports:
      - "5002:5001"
    volumes:
      - ./public:/app/public
      - ./controllers:/app/controllers
      - ./services:/app/services
      - ./models:/app/models
      - ./middleware:/app/middleware
      - ./utils:/app/utils
      - ./config:/app/config
      - ./data:/app/data
      - ./server.js:/app/server.js
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_dev_data:
    name: KuraTe_mongo_dev_data
