<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>KuraTe - Escanear DNI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=8.30">
<style>
body.blueprint-theme{background:#0f0f1a;color:#eee}
.dni-wrap{max-width:480px;margin:0 auto;padding:16px}
.dni-preview{width:100%;height:220px;object-fit:contain;border-radius:8px;background:#111;display:block;margin-top:10px;border:1px dashed #333}
.dni-btn{width:100%;padding:14px;border-radius:8px;border:none;font-weight:700;cursor:pointer;margin-top:10px}
.dni-btn-cam{background:var(--primary-gold);color:#111}
.dni-btn-submit{background:#22c55e;color:#fff;font-size:1.05rem;padding:16px}
.dni-btn:disabled{opacity:0.5;cursor:not-allowed}
</style>
</head>
<body class="blueprint-theme">
<div class="dni-wrap">
  <a href="/profile.html" style="color:var(--primary-gold);text-decoration:none;font-size:0.85rem">← Volver</a>
  <h2 class="gold-text" style="text-align:center;margin:16px 0 8px">📸 Escaneá tu DNI</h2>
  <p style="text-align:center;color:#aaa;font-size:0.85rem;line-height:1.5;margin-bottom:16px">Solo el <b style="color:#fff">frente</b> con código de barras. Extraemos tus datos automáticamente.<br><span style="color:#f59e0b">Usá buena luz, sin reflejos.</span></p>
  <div id="dniAlert" class="hidden" style="padding:10px;border-radius:6px;margin-bottom:12px;text-align:center;font-size:0.9rem"></div>

  <div class="dni-step" id="stepFront" style="border:1px solid rgba(212,175,55,0.3);border-radius:12px;padding:14px;background:rgba(255,255,255,0.03)">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>Frente del DNI</b><span id="okFront" style="display:none;color:#22c55e">✓ capturado</span></div>
    <input type="file" id="fileFront" accept="image/*" capture="environment" style="display:none">
    <img id="prevFront" class="dni-preview" alt="preview frente" style="display:none">
    <button class="dni-btn dni-btn-cam" id="btnCam">📷 Capturar frente</button>
  </div>

  <div id="extracted" style="display:none;margin-top:14px;border:1px solid #2a2a3e;border-radius:8px;padding:12px;background:rgba(34,197,94,0.08)">
    <div style="color:#22c55e;font-weight:700;margin-bottom:6px">✓ Datos extraídos</div>
    <div id="extractedData" style="font-size:0.85rem;color:#ddd;line-height:1.6"></div>
  </div>

  <button id="btnSubmitDni" class="dni-btn dni-btn-submit" disabled>Confirmar y continuar</button>
  <p style="text-align:center;color:#666;font-size:0.75rem;margin-top:10px">Al confirmar quedás en revisión. Te avisamos cuando seas aprobado.</p>
</div>

<script type="module">
const API = (location.protocol==='file:'?'http://localhost:5000':location.origin)+'/api/v1';
function authHeaders(){const t=localStorage.getItem('token');return t?{'Authorization':'Bearer '+t}:{}}
const alertEl=document.getElementById('dniAlert');
function showAlert(msg, ok=false){alertEl.textContent=msg; alertEl.style.background= ok?'rgba(34,197,94,0.15)':'rgba(220,38,38,0.15)'; alertEl.style.color= ok?'#22c55e':'#f87171'; alertEl.style.border='1px solid '+(ok?'#22c55e':'#ef4444'); alertEl.classList.remove('hidden');}
async function checkAlreadyVerified(){
  const token=localStorage.getItem('token');
  if(!token){location.href='/login.html';return}
  try{ const r=await fetch(API+'/professionals/me',{headers:authHeaders(),credentials:'include'}); const d=await r.json(); if(d.success && d.data && d.data.verificationStatus==='approved'){ showAlert('Ya estás verificado.',true); setTimeout(()=>location.href='/profile.html',1200); return} }catch{}
}
checkAlreadyVerified();

let preregId=null;
try{ preregId=new URLSearchParams(location.search).get('id') || JSON.parse(localStorage.getItem('user')||'{}')?._id }catch{}
const fileEl=document.getElementById('fileFront'), prev=document.getElementById('prevFront'), ok=document.getElementById('okFront'), btnCam=document.getElementById('btnCam'), btnSubmit=document.getElementById('btnSubmitDni');
let frontDataUrl=null;
btnCam.addEventListener('click',()=>fileEl.click());
fileEl.addEventListener('change',()=>{
  const f=fileEl.files[0]; if(!f) return;
  const url=URL.createObjectURL(f); prev.src=url; prev.style.display='block'; frontDataUrl=null; ok.style.display='inline'; btnSubmit.disabled=false;
  // leer como base64 para enviar a scan
  const reader=new FileReader(); reader.onload=e=>{frontDataUrl=e.target.result; autoScan();}; reader.readAsDataURL(f);
});
async function autoScan(){
  if(!frontDataUrl) return;
  showAlert('Escaneando código...',true);
  try{
    const token=localStorage.getItem('token');
    // intentar via pre-register scan si hay preregId, sino via verification-documents directo
    const id = new URLSearchParams(location.search).get('id');
    if(id){
      const r=await fetch(API+'/public/pre-register/scan-dni',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id, image: frontDataUrl})});
      const d=await r.json();
      if(r.ok){ showExtracted(d); showAlert('DNI escaneado correctamente',true); return}
      showAlert(d.error||'No se pudo leer el código, intentá de nuevo',false);
    } else {
      // para profesionales ya logueados, solo extraemos y guardamos luego con verification-documents (1 foto)
      showAlert('Foto capturada. Tocá Confirmar.',true);
    }
  }catch(e){ showAlert('Error de conexión',false)}
}
function showExtracted(data){
  const ex=document.getElementById('extracted'), box=document.getElementById('extractedData');
  const dni = data.dniNumeroTramite || data.dni || '';
  const nom = data.dniNombre || data.firstName || '';
  const ape = data.dniApellido || data.surname || '';
  box.innerHTML=`${nom||''} ${ape||''}<br>DNI: ${dni||'-'}<br>${data.dniFechaNacimiento? 'Nacimiento: '+data.dniFechaNacimiento:''}`;
  ex.style.display='block';
}

btnSubmit.addEventListener('click', async ()=>{
  if(!fileEl.files[0]){ showAlert('Capturá el frente del DNI',false); return}
  btnSubmit.disabled=true; const old=btnSubmit.textContent; btnSubmit.textContent='Enviando...';
  try{
    const fd=new FormData();
    fd.append('verificationDocuments', fileEl.files[0]);
    // endpoint ahora acepta 1 solo frente
    const res=await fetch(API+'/professionals/verification-documents',{method:'POST',headers:authHeaders(),body:fd,credentials:'include'});
    const data=await res.json();
    if(data.success){
      showAlert('✓ DNI recibido. Quedás en revisión.',true);
      setTimeout(()=>location.href='/profile.html',1200);
    } else {
      showAlert(data.error||'Error al enviar',false);
    }
  }catch(e){ showAlert('Error de conexión',false)}
  btnSubmit.disabled=false; btnSubmit.textContent=old;
});
</script>
</body>
</html>
