<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <title>KuraTe - Definí tu contraseña</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=8.25">
    <link rel="stylesheet" href="/css/blueprint.css?v=2">
    <link rel="stylesheet" href="/css/responsive.css?v=8.6">
    <meta name="theme-color" content="#B8922E">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="blueprint-theme blueprint-auth-page">
    <div style="padding:1rem 1rem 0;max-width:1200px;margin:0 auto;" role="navigation" aria-label="Volver"><a href="javascript:history.back()" class="fm-back-global">&#8592; Volver</a></div>
    <main class="container" id="main-content">
        <section style="display: flex; justify-content: center; padding-bottom: 100px;">
            <div class="card" style="width: 100%; max-width: 440px; text-align: center;">
                <h1 class="gold-text" style="font-size: 1.5em; margin-bottom: 20px;">Definí tu contraseña</h1>

                <div style="text-align: center; margin-bottom: 25px;">
                    <img src="/KuraTe_logo_black.png" alt="KuraTe Logo" style="height: 70px; width: auto; background-color: #000; border-radius: 8px; padding: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);">
                </div>

                <p class="recovery-step-text" style="margin-bottom: 20px;">
                    Un administrador generó una contraseña temporal para tu cuenta.
                    Elegí una contraseña propia para continuar.
                </p>

                <div id="setPwdAlert" class="alert hidden"></div>

                <form id="setPasswordForm" autocomplete="off">
                    <div class="form-group">
                        <label for="currentPassword">Contraseña temporal</label>
                        <input type="password" placeholder="Contraseña temporal" required id="currentPassword" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Nueva contraseña (mín. 6 caracteres)</label>
                        <input type="password" placeholder="Nueva contraseña" required id="newPassword" minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Repetí la nueva contraseña</label>
                        <input type="password" placeholder="Repetí la nueva contraseña" required id="confirmPassword" minlength="6" autocomplete="new-password">
                    </div>
                    <button type="submit" class="landing-btn landing-btn-login sa-btn sa-btn--solid" style="width:100%; margin-top:20px;">Guardar contraseña</button>
                </form>

                <p style="margin-top: 20px;">
                    <button type="button" id="setPwdLogout" style="background:none;border:none;color:var(--primary-gold);cursor:pointer;text-decoration:underline;font-size:0.9rem;">Salir y entrar con otra cuenta</button>
                </p>
            </div>
        </section>
    </main>

    <script type="module">
        import { showAlert, attachPasswordToggles } from '/js/uiHelpers.js';
        attachPasswordToggles();

        const form = document.getElementById('setPasswordForm');
        const alertBox = document.getElementById('setPwdAlert');
        const submitBtn = form.querySelector('button[type="submit"]');
        const token = localStorage.getItem('token');

        function fail(message, relatedInputId) {
            showAlert(alertBox, message, true, relatedInputId);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Guardar contraseña';
        }

        if (!token) {
            showAlert(alertBox, 'Tu sesión no está activa. Volvé a entrar con la contraseña temporal.', true, 'currentPassword');
            form.querySelectorAll('input, button[type="submit"]').forEach((el) => { el.disabled = true; });
        }

        document.getElementById('setPwdLogout').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');

            const currentPassword = document.getElementById('currentPassword').value;
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password.length < 6) { fail('La contraseña debe tener al menos 6 caracteres.', 'newPassword'); return; }
            if (password !== confirmPassword) { fail('Las contraseñas no coinciden.', 'confirmPassword'); return; }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';
            try {
                const r = await fetch('/api/v1/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ currentPassword, password, confirmPassword })
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok || !data.success) {
                    const map = { 401: ['La contraseña temporal no coincide.', 'currentPassword'] };
                    const [msg, inputId] = map[r.status] || [data.error || 'No se pudo cambiar la contraseña.', null];
                    fail(msg, inputId);
                    return;
                }

                try {
                    const stored = JSON.parse(localStorage.getItem('user') || 'null');
                    if (stored) {
                        stored.mustChangePassword = false;
                        localStorage.setItem('user', JSON.stringify(stored));
                    }
                } catch (_) {}

                showAlert(alertBox, 'Contraseña actualizada. Redirigiendo...', false);
                setTimeout(() => { window.location.href = '/index.html'; }, 900);
            } catch (err) {
                fail('Error de conexión.');
            }
        });
    </script>
</body>
</html>
