limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=3r/s;

# --- Compresion ---
# El modulo gzip ya viene compilado (--with-http_gzip_static_module) pero no
# estaba habilitado en ningun bloque, por eso se transferian ~1.7 MB sin comprimir.
# brotli NO esta compilado en esta imagen, no declararlo o nginx no arranca.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   512;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;
# No comprimir imagenes ya comprimidas ni binarios (solo gana CPU)
gzip_disable "msie6";

upstream app {
    server app:5000;
}

upstream web {
    server web:80;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name kurate.drsrv.net.ar;

    # ACME challenge (certbot webroot) if needed later
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kurate.drsrv.net.ar;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Trust only our own proxy for real-ip (Docker gateway)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- Admin routes: protected by JWT + admin role in the app ---
    location ~ ^/(api/v1/admin|admin) {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Rate-limited API ---
    location /api/ {
        limit_req zone=apilimit burst=20 nodelay;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect /index.html to / to avoid duplicate content
    location = /index.html {
        return 301 /;
    }

    # Redirect dead URLs Google is crawling
    location = /categorias { return 301 /hogar.html; }
    location ~ ^/categorias/ { return 301 /hogar.html; }
    location = /entornos { return 301 /hogar.html; }
    location ~ ^/entornos\? { return 301 /hogar.html; }
    location = /accione { return 301 /; }

    # --- Imagenes: cache largo (nombres con hash, no cambian de contenido) ---
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico)$ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # el header del app pisa el de nginx si no lo ocultamos
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- JS/CSS: revalidar siempre (ETag -> 304 sin body) ---
    # Se despliega seguido y los assets NO tienen hash en el nombre, asi que un
    # max-age largo serviria versiones viejas. must-revalidate mantiene la
    # correccion y aun asi evita bajar el archivo de nuevo.
    location ~* \.(css|js|mjs)$ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- React SPA (new frontend) ---
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # HTML: sin no-store. Debe revalidarse para que un deploy se vea al toque.
        add_header Cache-Control "no-cache" always;
    }
}
